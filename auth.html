<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join SkillBridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>

<body class="auth-body">
    <div class="auth-container">
        <a href="index.html" class="logo">
            Skill<span>Bridge.</span>
        </a>
        <div class="auth-card">
            <div class="auth-heading">
                <span class="section-label">YOUR LEARNING JOURNEY STARTS HERE</span>
                <h1 id="authTitle">Create Your Account</h1>
                <p id="authSubtitle">Join our community and start exchanging skills.</p>
            </div>
            <form id="authForm">

                <div class="form-group" id="nameGroup">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="form-group" id="confirmGroup">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password">
                </div>
                <p id="authMessage" class="auth-message"></p>

                <button type="submit" class="auth-submit" id="authSubmit">
                    Create Account →
                </button>
            </form>
            <div class="auth-switch">
                <p id="switchText">Already have an account?</p>
                <button type="button" id="switchMode">Log In</button>
            </div>

            <a href="index.html" class="back-home">← Back to Home</a>
        </div>
        <p class="auth-footer">© 2026 SkillBridge. All rights reserved.</p>
    </div>
    <script src="script.js"></script>
</body>


</body>
</html>
